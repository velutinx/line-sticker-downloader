<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Sticker Downloader — VELUTINX</title>
<style>
:root { color-scheme: light; --bg: #d3d0c1; --panel: #e3e0d4; --text: #3a3528; --muted: #716b5b; --accent: #aa9e76; --border: #b9b29b; --hover: #c7bea0; --shadow: rgba(58, 53, 40, .10); --success: #536447; --danger: #8b3933; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 36px 18px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.app { width: min(100%, 640px); }
header { text-align: center; margin-bottom: 28px; }
.eyebrow { margin: 0 0 10px; font-size: .72rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.045em; line-height: 1.05; }
.panel { padding: clamp(20px, 4vw, 30px); background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 12px 35px var(--shadow); }
.field { margin-bottom: 18px; }
.field:last-of-type { margin-bottom: 0; }
label { display: block; margin-bottom: 7px; font-size: .82rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
input[type="text"] { width: 100%; padding: 12px 14px; font: inherit; font-size: .95rem; color: var(--text); background: rgba(255,255,255,.35); border: 1px solid var(--border); border-radius: 10px; outline: none; transition: border-color .2s, background .2s; }
input[type="text"]:focus { border-color: var(--accent); background: rgba(255,255,255,.55); }
.hint { margin-top: 6px; color: var(--muted); font-size: .78rem; line-height: 1.5; }
.primary-button { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 750; width: 100%; min-height: 48px; margin-top: 20px; padding: 14px 18px; font-size: .95rem; color: #fffdf7; background: var(--text); border-radius: 999px; transition: filter .2s, transform .2s; }
.primary-button:hover:not(:disabled) { filter: brightness(1.12); }
.primary-button:active:not(:disabled) { transform: translateY(1px); }
.primary-button:disabled { opacity: .55; cursor: not-allowed; }
#status { margin-top: 16px; padding: 0 4px; font-size: .85rem; line-height: 1.55; color: var(--muted); text-align: center; white-space: pre-wrap; }
#status.error { color: var(--danger); }
#status.success { color: var(--success); }
.toast { position: fixed; left: 50%; bottom: 20px; z-index: 10; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; background: var(--text); color: #fffdf7; font-size: .88rem; box-shadow: 0 8px 25px var(--shadow); transform: translate(-50%, 15px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
    <main class="app">
        <header>
            <p class="eyebrow">VELUTINX · Utilities</p>
            <h1>LINE Sticker Downloader</h1>
        </header>

        <section class="panel" aria-label="LINE sticker downloader">
            <div class="field">
                <label for="url">Sticker pack URL</label>
                <input type="text" id="url" value="https://store.line.me/stickershop/product/37295/en"
                       placeholder="https://store.line.me/stickershop/product/37295/en"
                       autocomplete="off" spellcheck="false">
                <p class="hint">Find a pack at store.line.me and copy its URL.</p>
            </div>

            <button class="primary-button" id="downloadBtn" type="button">Download Stickers</button>

            <div id="status" aria-live="polite"></div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            const button = document.getElementById('downloadBtn');
            const statusDiv = document.getElementById('status');
            const toast = document.getElementById('toast');
            let toastTimer;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
            }

            function setStatus(message, kind) {
                statusDiv.textContent = message;
                statusDiv.className = kind || '';
            }

            button.addEventListener('click', async () => {
                const url = document.getElementById('url').value.trim();

                if (!url) {
                    setStatus('Please enter a LINE sticker URL.', 'error');
                    return;
                }

                setStatus('Downloading… this can take a while.');
                button.disabled = true;

                try {
                    const response = await fetch('/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            url,
                            convertToGif: true
                        })
                    });

                    if (!response.ok) {
                        let msg = 'Server error: ' + response.status;
                        try {
                            const j = await response.json();
                            if (j && j.error) msg = j.error;
                        } catch (_) {}
                        throw new Error(msg);
                    }

                    // Dynamically extract filename from server's Content-Disposition header
                    let filename = 'line-stickers.zip';
                    const disposition = response.headers.get('content-disposition');
                    if (disposition && disposition.includes('filename=')) {
                        const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                        if (match && match[1]) {
                            filename = match[1].replace(/['"]/g, '');
                        }
                    }

                    const blob = await response.blob();
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(downloadUrl);

                    setStatus('Download complete!', 'success');
                    showToast('Sticker pack downloaded');
                } catch (err) {
                    setStatus('Error: ' + err.message, 'error');
                } finally {
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
