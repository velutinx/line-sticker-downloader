<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LINE Sticker Downloader</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .row { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>LINE Sticker Downloader</h1>

  <div class="row">
    <label for="url">Sticker pack URL</label>
    <input type="text" id="url"
           placeholder="https://store.line.me/stickershop/product/37295/en">
  </div>

  <div class="row">
    <label for="delay">Animated wait delay (ms)</label>
    <input type="number" id="delay" value="1000" min="0">
  </div>

  <div class="row">
    <label>
      <input type="checkbox" id="gif"> Convert animated stickers to GIF
    </label>
  </div>

  <div class="row">
    <button id="downloadBtn">Download Stickers</button>
  </div>

  <div id="status"></div>

  <script>
    const button = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');

    button.addEventListener('click', async () => {
      const url = document.getElementById('url').value.trim();
      const convertToGif = document.getElementById('gif').checked;
      const animatedWaitDelay = parseInt(document.getElementById('delay').value, 10) || 0;

      if (!url) {
        statusDiv.textContent = 'Please enter a LINE sticker URL';
        statusDiv.className = 'error';
        return;
      }

      statusDiv.className = '';
      statusDiv.textContent = 'Downloading... this can take a while.';
      button.disabled = true;

      try {
        // Use a relative URL so this works regardless of origin
        const response = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, convertToGif, animatedWaitDelay })
        });

        if (!response.ok) {
          let msg = 'Server error: ' + response.status;
          try {
            const j = await response.json();
            if (j && j.error) msg = j.error;
          } catch (_) {}
          throw new Error(msg);
        }

        const blob = await response.blob();
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'line-stickers.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(downloadUrl);

        statusDiv.textContent = 'Download complete';
      } catch (err) {
        statusDiv.textContent = 'Error: ' + err.message;
        statusDiv.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
